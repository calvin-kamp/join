@if (isExternal()) {
    <a
        [attr.href]="href()"
        target="_blank"
        rel="noopener noreferrer"
        [class]="linkClasses()"
        uiButton
        [variant]="buttonVariant()"
    >
        <ng-content />
    </a>
} @else {
    <a
        [routerLink]="href()"
        [class]="linkClasses()"
        uiButton
        [variant]="buttonVariant()"
    >
        <ng-content />
    </a>
}
