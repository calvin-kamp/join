@if (isExternal()) {
    <a
        [attr.href]="href()"
        [attr.target]="opensInNewTab() ? '_blank' : null"
        [attr.rel]="opensInNewTab() ? 'noopener noreferrer' : null"
        [class]="linkClasses()"
        uiButton
        [variant]="buttonVariant()"
    >
        <ng-content />
    </a>
} @else {
    <a
        [routerLink]="href()"
        [class]="linkClasses()"
        uiButton
        [variant]="buttonVariant()"
    >
        <ng-content />
    </a>
}
