@if (isExternal()) {
    <a
        [href]="href()"
        [target]="opensInNewTab() ? '_blank' : null"
        [rel]="opensInNewTab() ? 'noopener noreferrer' : null"
        [class]="linkClasses()"
        uiButton
        [variant]="buttonVariant()"
    >
        {{ label() }}
    </a>
} @else {
    <a
        [routerLink]="href()"
        [class]="linkClasses()"
        uiButton
        [variant]="buttonVariant()"
    >
        {{ label() }}
    </a>
}
