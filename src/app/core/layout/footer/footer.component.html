<footer class="footer">
    <div
        class="footer__wrapper"
        [class.footer__wrapper--logged-in]="auth.isLoggedIn()"
    >
        <ui-logo
            class="footer__logo"
            variant="light"
        />

        <nav class="footer__nav">
            <ul class="footer__nav-list">
                @if (auth.isLoggedIn()) {
                    @for (link of navigationLinks; track link.href) {
                        <li class="footer__nav-item">
                            <ui-link
                                [linkStyle]="'no-decoration'"
                                [href]="link.href"
                                [linkClass]="'footer__nav-link'"
                                [activeClass]="'footer__nav-link--active'"
                                [activeOptions]="link.activeOptions"
                            >
                                <ui-icon [name]="link.iconName" />

                                <span class="footer__nav-label">
                                    {{ link.label }}
                                </span>
                            </ui-link>
                        </li>
                    }
                } @else {
                    <li class="footer__nav-item">
                        <ui-link
                            [linkStyle]="'no-decoration'"
                            [href]="'auth/sign-in'"
                            [linkClass]="'footer__nav-link'"
                        >
                            <ui-icon [name]="'nav-login'" />

                            <span class="footer__nav-label"> Log In</span>
                        </ui-link>
                    </li>
                }
            </ul>
        </nav>

        @if (!auth.isLoggedIn()) {
            <nav class="footer__nav">
                <ul class="footer__legal-list footer__nav-list">
                    <li class="footer__nav-item">
                        <ui-link
                            [href]="'/privacy-policy'"
                            [linkStyle]="'no-decoration'"
                            [linkClass]="'footer__nav-link'"
                            [activeClass]="'footer__nav-link--active'"
                        >
                            Privacy Policy
                        </ui-link>
                    </li>

                    <li class="footer__nav-item">
                        <ui-link
                            [href]="'/legal-notice'"
                            [linkStyle]="'no-decoration'"
                            [linkClass]="'footer__nav-link'"
                            [activeClass]="'footer__nav-link--active'"
                        >
                            Legal Notice
                        </ui-link>
                    </li>
                </ul>
            </nav>
        }
    </div>
</footer>
