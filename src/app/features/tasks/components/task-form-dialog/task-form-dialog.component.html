<ui-dialog
    [id]="'task-form-dialog'"
    [open]="open()"
    (close)="onCloseRequested()"
>
    @if (open()) {
        <tasks-task-form
            [showClose]="true"
            [statusId]="statusId()"
            [task]="task()"
            (close)="onCloseRequested()"
            (created)="onTaskCreated()"
        />
    }
</ui-dialog>
