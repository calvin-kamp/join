<div class="search">
    <ui-input
        [formControl]="searchControl"
        name="search"
        label="Find Task"
        type="text"
        [labelVisible]="false"
    />
    <ui-icon
        name="search"
        class="search__icon"
        (click)="loadTasks()"
    />

    @if (error()) {
        <span
            role="alert"
            class="search__error"
            >{{ error() }}</span
        >
    }
</div>
